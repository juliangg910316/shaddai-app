name: shaddai
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0
  google_maps_flutter: ^2.18.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  table_calendar: ^3.2.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  uuid: ^4.6.0

dependency_overrides:
  # TEMP: pin older native Android plugin builds to avoid a Kotlin Build
  # Tools API "cacheable" incremental-cache crash on Windows
  # ("Storage ... is already registered") hit by the latest
  # google_maps_flutter_android/google_sign_in_android Gradle scripts.
  # Remove once upstream ships a fix.
  google_maps_flutter_android: 2.19.6
  google_sign_in_android: 7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1

flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Tipografías de la identidad Shaddai:
  # Cormorant Garamond para títulos, Jost para la UI.
  # Ambas son variables (eje wght), Flutter interpola los pesos.
  fonts:
  - family: Cormorant Garamond
    fonts:
    - asset: assets/fonts/CormorantGaramond-Variable.ttf
  - family: Jost
    fonts:
    - asset: assets/fonts/Jost-Variable.ttf
