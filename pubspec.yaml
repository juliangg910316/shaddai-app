name: shaddai
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  google_maps_flutter: ^2.19.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_riverpod: ^3.4.2
  go_router: ^18.1.1
  table_calendar: ^3.2.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.3

dependency_overrides:
  # TEMP: pin older native Android plugin builds to avoid a Kotlin Build
  # Tools API "cacheable" incremental-cache crash on Windows
  # ("Storage ... is already registered") hit by the latest
  # google_maps_flutter_android/google_sign_in_android Gradle scripts.
  # Remove once upstream ships a fix.
  google_maps_flutter_android: 2.21.0
  google_sign_in_android: 7.2.18

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1

flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Logotipo de Studio Shaddai, el mismo sello que usa shaddai-web.
  assets:
  - assets/images/logo_monogram.svg
  # Imágenes de la landing de Web, traídas de shaddai-web (spec 002).
  - assets/images/landing/
  - assets/images/landing/catalogo/
  - assets/images/landing/galeria/
  # Tipografías de la identidad Shaddai, incluidas en la app (spec 001, RNF-5):
  # Cormorant Garamond para títulos, Inter para la UI.
  # Ambas son variables (eje wght), Flutter interpola los pesos.
  fonts:
  - family: Cormorant Garamond
    fonts:
    - asset: assets/fonts/CormorantGaramond-Variable.ttf
  - family: Inter
    fonts:
    - asset: assets/fonts/Inter-Variable.ttf
